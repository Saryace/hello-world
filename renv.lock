    "audio": {
      "Package": "audio",
      "Version": "0.1-12",
      "Source": "Repository",
      "Title": "Audio Interface for R",
      "Author": "Simon Urbanek [aut, cre, cph] (https://urbanek.nz, ORCID: <https://orcid.org/0000-0003-2297-1732>)",
      "Authors@R": "person(\"Simon\", \"Urbanek\", role=c(\"aut\",\"cre\",\"cph\"), email=\"Simon.Urbanek@r-project.org\", comment=c(\"https://urbanek.nz\", ORCID=\"0000-0003-2297-1732\"))",
      "Maintainer": "Simon Urbanek <Simon.Urbanek@r-project.org>",
      "Depends": [
        "R (>= 2.0.0)"
      ],
      "Description": "Interfaces to audio devices (mainly sample-based) from R to allow recording and playback of audio. Built-in devices include Windows MM, Mac OS X AudioUnits and PortAudio (the last one is very experimental).",
      "License": "MIT + file LICENSE",
      "URL": "http://www.rforge.net/audio/",
      "BugReports": "https://github.com/s-u/audio/issues/",
      "NeedsCompilation": "yes",
      "Repository": "CRAN",
      "Encoding": "UTF-8"
    },
    "beepr": {
      "Package": "beepr",
      "Version": "2.0",
      "Source": "Repository",
      "Type": "Package",
      "Title": "Easily Play Notification Sounds on any Platform",
      "Encoding": "UTF-8",
      "Date": "2024-07-06",
      "Authors@R": "c( person(\"Rasmus\", \"Bååth\", email = \"rasmus.baath@gmail.com\", role = c(\"aut\", \"cre\")),  person(\"Amanda\", \"Dobbyn\", email = \"amanda.e.dobbyn@gmail.com\", role = \"ctb\"))",
      "Description": "The main function of this package is beep(), with the purpose to make it easy to play notification sounds on whatever platform you are on. It is intended to be useful, for example, if you are running a long analysis in the background and want to know when it is ready.",
      "License": "GPL-3",
      "URL": "https://github.com/rasmusab/beepr",
      "BugReports": "https://github.com/rasmusab/beepr/issues",
      "Imports": [
        "audio"
      ],
      "RoxygenNote": "7.3.1",
      "Suggests": [
        "testthat (>= 3.0.0)"
      ],
      "Config/testthat/edition": "3",
      "NeedsCompilation": "no",
      "Author": "Rasmus Bååth [aut, cre], Amanda Dobbyn [ctb]",
      "Maintainer": "Rasmus Bååth <rasmus.baath@gmail.com>",
      "Repository": "CRAN"
    },
    "renv": {
      "Package": "renv",
      "Version": "1.2.4",
      "Source": "Repository",
      "Type": "Package",
      "Title": "Project Environments",
